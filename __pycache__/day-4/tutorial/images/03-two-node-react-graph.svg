<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Explicit graph state and structured output</title>
  <desc id="desc">LangGraph routes between an agent, ToolNode, and structured proposal node. RepairState, SQLiteSaver, and a recursion limit provide an explicit contract, persistence, and a hard stop.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#4f46e5"/></marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 21px Inter,Arial,sans-serif;fill:#475569}.h{font:700 23px Inter,Arial,sans-serif;fill:#0f172a}.b{font:500 18px Inter,Arial,sans-serif;fill:#334155}.small{font:500 15px Inter,Arial,sans-serif;fill:#475569}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1e293b}.tag{font:700 14px Inter,Arial,sans-serif;fill:#3730a3;letter-spacing:.5px}.edge{stroke:#4f46e5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/><rect width="18" height="900" fill="#4f46e5"/>
  <text class="title" x="72" y="76">Explicit state, structured proposal</text>
  <text class="sub" x="72" y="112">The router reads the latest AI message; the final node validates what enters state.</text>

  <g filter="url(#shadow)">
    <circle cx="130" cy="348" r="52" fill="#0f172a"/><text x="103" y="355" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#fff">START</text>
    <path class="edge" d="M182 348H292"/>
    <rect x="306" y="244" width="354" height="208" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text class="tag" x="338" y="286">NODE 1</text>
    <text class="h" x="338" y="326">agent</text>
    <text class="mono" x="338" y="364">model_with_tools.invoke(...)</text>
    <text class="mono" x="338" y="400">return {"messages": [response]}</text>
    <path class="edge" d="M660 348H774"/>
    <path d="M860 272L954 348L860 424L766 348Z" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <text class="mono" x="808" y="338">tool_calls</text>
    <text class="mono" x="826" y="368">present?</text>
    <path class="edge" d="M954 348H1060"/>
    <text class="tag" x="982" y="328">YES</text>
    <rect x="1074" y="260" width="310" height="176" rx="20" fill="#ecfdf5" stroke="#2dd4bf" stroke-width="3"/>
    <text class="tag" x="1106" y="302">NODE 2</text>
    <text class="h" x="1106" y="342">tools</text>
    <text class="mono" x="1106" y="374">ToolNode([</text>
    <text class="mono" x="1126" y="400">run_knapsack_test</text>
    <text class="mono" x="1106" y="426">])</text>
    <path class="edge" d="M1228 260V196H484V234"/>
    <text class="tag" x="678" y="184">OBSERVATION → NEXT MODEL DECISION</text>
    <path class="edge" d="M860 424V565H1060"/>
    <text class="tag" x="886" y="545">EVIDENCE SUFFICIENT</text>
    <rect x="1074" y="500" width="310" height="130" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
    <text class="tag" x="1106" y="536">NODE 3</text>
    <text class="h" x="1106" y="572">proposal</text>
    <text class="mono" x="1106" y="606">RepairProposal</text>
    <path class="edge" d="M1384 565H1412"/>
    <circle cx="1474" cy="565" r="52" fill="#0f172a"/><text x="1454" y="572" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#fff">END</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="686" width="850" height="152" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="tag" x="104" y="724">RepairState IS THE CHECKPOINTED CONTRACT</text>
    <text class="mono" x="104" y="764">messages · problem · source_code · test_cases</text>
    <text class="mono" x="104" y="800">diagnosis · confidence · fixed_code</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="954" y="686" width="574" height="152" rx="18" fill="#0f172a"/>
    <text x="986" y="724" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#a5b4fc">TWO DIFFERENT CONTROLS</text>
    <text x="986" y="764" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">SqliteSaver + thread_id → durable scratchpad</text>
    <text x="986" y="800" font-family="Inter,Arial" font-size="18" font-weight="700" fill="#fff">recursion_limit = 8 → hard loop stop</text>
  </g>
</svg>
