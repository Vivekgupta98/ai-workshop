<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The ReAct loop</title>
  <desc id="desc">A technical flow showing an agent decision, one Judge0 tool action, an observation, repetition, and the decision to leave the loop for structured output.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#4f46e5"/></marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 21px Inter,Arial,sans-serif;fill:#475569}.h{font:700 23px Inter,Arial,sans-serif;fill:#0f172a}.b{font:500 18px Inter,Arial,sans-serif;fill:#334155}.small{font:500 15px Inter,Arial,sans-serif;fill:#475569}.mono{font:600 16px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1e293b}.tag{font:700 14px Inter,Arial,sans-serif;fill:#3730a3;letter-spacing:.5px}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.edge{stroke:#4f46e5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/><rect width="18" height="900" fill="#4f46e5"/>
  <text class="title" x="72" y="76">ReAct = decide → act → observe</text>
  <text class="sub" x="72" y="112">The model chooses the next action; the tool supplies evidence; the observation changes the next decision.</text>

  <g filter="url(#shadow)">
    <rect class="card" x="72" y="210" rx="18" width="280" height="214"/>
    <text class="tag" x="102" y="250">HUMAN MESSAGE</text>
    <text class="h" x="102" y="294">Repair this program</text>
    <text class="mono" x="102" y="334">problem + buggy_code</text>
    <text class="small" x="102" y="382">The starting state is explicit.</text>
  </g>
  <path class="edge" d="M352 316H466"/>

  <g filter="url(#shadow)">
    <rect x="480" y="184" rx="22" width="360" height="266" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text class="tag" x="512" y="226">AGENT NODE</text>
    <text class="h" x="512" y="270">Model chooses an action</text>
    <rect x="512" y="300" width="296" height="54" rx="12" fill="#fff"/>
    <text class="mono" x="528" y="334">AIMessage(tool_calls=[...])</text>
    <rect x="512" y="370" width="296" height="54" rx="12" fill="#fff"/>
    <text class="mono" x="528" y="404">AIMessage("READY_TO_REPAIR")</text>
  </g>

  <path class="edge" d="M840 270H970"/>
  <text class="tag" x="870" y="250">ACTION</text>
  <g filter="url(#shadow)">
    <rect class="card" x="984" y="184" rx="18" width="472" height="178"/>
    <text class="tag" x="1016" y="224">TOOL CALL</text>
    <text class="h" x="1016" y="267">run_knapsack_test</text>
    <text class="mono" x="1016" y="307">{source_code: "...", test_number: 2}</text>
    <rect x="1322" y="208" width="102" height="38" rx="19" fill="#0f766e"/>
    <text x="1341" y="233" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#fff">Judge0</text>
  </g>

  <path class="edge" d="M1220 362V520H842"/>
  <text class="tag" x="1006" y="500">OBSERVATION</text>
  <g filter="url(#shadow)">
    <rect x="480" y="500" rx="18" width="360" height="180" fill="#ecfdf5" stroke="#2dd4bf" stroke-width="3"/>
    <text class="tag" x="512" y="540">TOOL MESSAGE</text>
    <text class="mono" x="512" y="580">test_number: 2</text>
    <text class="mono" x="512" y="614">expected: 3</text>
    <text class="mono" x="512" y="648">actual: 6 · Wrong Answer</text>
  </g>
  <path class="edge" d="M480 590H420C388 590 382 554 382 516V390C382 346 420 316 466 316"/>
  <text class="tag" x="250" y="554">OBSERVE, THEN DECIDE AGAIN</text>

  <path class="edge" d="M840 412H1042V568"/>
  <text class="tag" x="886" y="392">NO TOOL CALL</text>
  <g filter="url(#shadow)">
    <rect x="984" y="578" width="472" height="124" rx="18" fill="#0f172a"/>
    <text x="1016" y="618" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#a5b4fc">LEAVE THE REACT LOOP</text>
    <text x="1016" y="658" font-family="Inter,Arial" font-size="21" font-weight="700" fill="#fff">READY_TO_REPAIR</text>
  </g>

  <rect x="72" y="766" width="1456" height="76" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="tag" x="102" y="798">TEACHING NOTE</text>
  <text class="b" x="102" y="826">The transcript shows tool calls and results. Hidden reasoning is not needed.</text>
</svg>
