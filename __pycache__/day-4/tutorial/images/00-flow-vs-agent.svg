<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why an LLM flow is not automatically an agent</title>
  <desc id="desc">A fixed triage workflow is compared with an agent that chooses its next action and stopping point from observations while remaining inside tool and step limits.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L10 5L0 10Z" fill="#4f46e5"/>
    </marker>
    <style>
      .title{font:700 42px Inter,Arial,sans-serif;fill:#0f172a}.sub{font:400 20px Inter,Arial,sans-serif;fill:#475569}.h{font:700 23px Inter,Arial,sans-serif;fill:#0f172a}.b{font:500 17px Inter,Arial,sans-serif;fill:#334155}.small{font:500 14px Inter,Arial,sans-serif;fill:#475569}.mono{font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#1e293b}.tag{font:700 13px Inter,Arial,sans-serif;fill:#3730a3;letter-spacing:.6px}.edge{stroke:#4f46e5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/><rect width="18" height="900" fill="#4f46e5"/>
  <text class="title" x="72" y="74">An LLM inside a flow is still a flow</text>
  <text class="sub" x="72" y="110">The key question is who chooses the next action and when the work is complete.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="150" width="704" height="548" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="72" y="150" width="704" height="62" rx="20" fill="#334155"/>
    <text x="102" y="190" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#fff">Fixed triage flow</text>
    <text class="tag" x="102" y="250">THE AUTHOR DEFINES THE TRAJECTORY</text>

    <rect x="104" y="282" width="154" height="70" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text class="mono" x="142" y="324">buggy code</text>
    <path class="edge" d="M258 317H330"/>
    <path d="M422 260L514 317L422 374L330 317Z" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text class="tag" x="379" y="308">LLM</text><text class="mono" x="370" y="334">triage</text>

    <path class="edge" d="M514 286H552V264H582"/>
    <path class="edge" d="M514 317H582"/>
    <path class="edge" d="M514 348H552V412H582"/>
    <rect x="592" y="232" width="150" height="64" rx="12" fill="#f1f5f9"/><text class="mono" x="616" y="270">syntax node</text>
    <rect x="592" y="306" width="150" height="64" rx="12" fill="#f1f5f9"/><text class="mono" x="612" y="344">runtime node</text>
    <rect x="592" y="380" width="150" height="64" rx="12" fill="#f1f5f9"/><text class="mono" x="620" y="418">logic node</text>

    <rect x="104" y="486" width="638" height="166" rx="15" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="tag" x="132" y="522">WHY THIS IS NOT YET AN AGENT</text>
    <text class="b" x="132" y="558">• The branch options are fixed in code.</text>
    <text class="b" x="132" y="590">• Every branch follows a predefined repair step.</text>
    <text class="b" x="132" y="622">• The model classifies; it does not choose a new action or stop rule.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="824" y="150" width="704" height="548" rx="20" fill="#fff" stroke="#6366f1" stroke-width="3"/>
    <rect x="824" y="150" width="704" height="62" rx="20" fill="#4f46e5"/>
    <text x="854" y="190" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#fff">Agentic evidence loop</text>
    <text class="tag" x="854" y="250">THE MODEL CHOOSES WITHIN BOUNDARIES</text>

    <rect x="856" y="280" width="184" height="82" rx="13" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text class="mono" x="886" y="313">goal + state</text><text class="small" x="880" y="342">problem · code · evidence</text>
    <path class="edge" d="M1040 321H1102"/>
    <path d="M1192 254L1286 321L1192 388L1098 321Z" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/>
    <text class="tag" x="1150" y="312">MODEL</text><text class="mono" x="1142" y="338">decides</text>

    <path class="edge" d="M1286 282H1328V257H1364"/>
    <path class="edge" d="M1286 321H1364"/>
    <path class="edge" d="M1286 360H1328V385H1364"/>
    <rect x="1374" y="230" width="122" height="54" rx="11" fill="#f1f5f9"/><text class="mono" x="1394" y="263">reason</text>
    <rect x="1374" y="294" width="122" height="54" rx="11" fill="#ecfdf5"/><text class="mono" x="1390" y="327">Judge0</text>
    <rect x="1374" y="358" width="122" height="54" rx="11" fill="#0f172a"/><text x="1393" y="392" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="600" fill="#fff">propose</text>

    <path class="edge" d="M1434 348V462H1192V392"/>
    <text class="small" x="1240" y="450">observation changes the next choice</text>

    <rect x="856" y="486" width="640" height="166" rx="15" fill="#ecfdf5" stroke="#2dd4bf" stroke-width="2"/>
    <text class="tag" x="884" y="522">WHAT MAKES IT AGENTIC</text>
    <text class="b" x="884" y="558">• It chooses whether another tool call is useful.</text>
    <text class="b" x="884" y="590">• Its path changes when observations change.</text>
    <text class="b" x="884" y="622">• It decides when evidence is sufficient and exits with confidence.</text>
  </g>

  <rect x="72" y="738" width="1456" height="116" rx="17" fill="#0f172a"/>
  <text x="104" y="778" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#a5b4fc" letter-spacing=".6">BOUNDARIES STILL COME FROM CODE</text>
  <text x="104" y="820" font-family="Inter,Arial" font-size="22" font-weight="700" fill="#fff">Allowed tools · execution sandbox · checkpointing · recursion limit · final verification</text>
</svg>
